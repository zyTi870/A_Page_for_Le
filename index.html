<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Page for Le</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffcc;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border: 1px solid #00ffcc;
            border-radius: 4px;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            min-width: 200px;
        }
        .label { color: #aaa; }
        .value { font-weight: bold; font-family: monospace; font-size: 1.1em; }
        #progress-bar {
            width: 100%;
            height: 4px;
            background: #333;
            margin-top: 10px;
            position: relative;
        }
        #progress-fill {
            height: 100%;
            background: #00ffcc;
            width: 0%;
            transition: width 0.1s;
            box-shadow: 0 0 10px #00ffcc;
        }
    </style>
    <!-- Three.js Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Controls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Post-processing -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>
    <div id="ui">
        <div style="text-align: center; margin-bottom: 10px; color: #fff; font-weight: bold;">HEART CORE STRESS TEST</div>
        <div class="stat-row">
            <span class="label">BLOCKS:</span>
            <span class="value" id="block-count">0</span>
        </div>
        <div class="stat-row">
            <span class="label">FPS:</span>
            <span class="value" id="fps-counter">60</span>
        </div>
        <div class="stat-row">
            <span class="label">STATUS:</span>
            <span class="value" id="status-text">INITIALIZING</span>
        </div>
        <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>
    <div id="canvas-container"></div>
    <script src="script.js"></script>
</body>
</html>
